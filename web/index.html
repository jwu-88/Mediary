  <!-- Browser OCR is used only for user-selected/pasted images. The native
       apps use ML Kit through the platform adapter instead. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
  <script>
    window.MediaryOcr = window.MediaryOcr || {};
    window.MediaryOcr._worker = null;
    window.MediaryOcr.recognize = async function (imageDataUrl) {
      if (!window.Tesseract) return '';
      try {
        if (!window.MediaryOcr._worker) {
          // This page pins Tesseract.js 4: createWorker accepts options, and
          // language loading/initialization must finish before recognition.
          // The version-5 createWorker('eng', ...) signature fails on v4.
          window.MediaryOcr._worker = await Tesseract.createWorker({
            workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/worker.min.js',
            langPath: 'https://tessdata.projectnaptha.com/4.0.0',
            corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@4.0.4'
          });
          await window.MediaryOcr._worker.loadLanguage('eng');
          await window.MediaryOcr._worker.initialize('eng');
        }

        // Normalize through a canvas so browsers decode AVIF/HEIC uploads
        // before Tesseract receives them. Small product photos often have
        // label text that is only a few pixels high, so an upscale is
        // important here: the old max(1, ...) scale silently left a 768px
        // image at 768px and sent its soft text to OCR unchanged.
        var sourceCanvas = await new Promise(function (resolve) {
          var image = new Image();
          image.onload = function () {
            try {
              var maxDimension = 2400;
              var sourceDimension = Math.max(
                image.naturalWidth,
                image.naturalHeight
              );
              // Upscale small labels, but never enlarge an already large
              // upload beyond the OCR worker's practical input size.
              var scale = Math.min(2.5, maxDimension / sourceDimension);
              var canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
              canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
              var context = canvas.getContext('2d');
              if (!context) return resolve(null);
              context.imageSmoothingEnabled = true;
              context.imageSmoothingQuality = 'high';
              // Remove transparent-image artifacts before OCR. A transparent
              // canvas can otherwise turn otherwise valid label pixels into
              // zero-alpha text for the OCR worker.
              context.fillStyle = '#ffffff';
              context.fillRect(0, 0, canvas.width, canvas.height);
              context.drawImage(image, 0, 0, canvas.width, canvas.height);
              resolve(canvas);
            } catch (_) {
              resolve(null);
            }
          };
          image.onerror = function () { resolve(null); };
          image.src = imageDataUrl;
        });

        if (!sourceCanvas) {
          // If the browser cannot decode the format, retain the original data
          // URL so Tesseract can still attempt recognition directly.
          await window.MediaryOcr._worker.setParameters({
            tessedit_pageseg_mode: '11',
            preserve_interword_spaces: '1'
          });
          var fallback = await window.MediaryOcr._worker.recognize(imageDataUrl);
          return fallback && fallback.data ? (fallback.data.text || '') : '';
        }

        // Create a high-contrast grayscale pass as well as a binary pass. The
        // Claritin package has pale text and uneven lighting, which can leave
        // the default color pass with no detectable glyphs. Auto-leveling
        // from the image histogram keeps this useful for both bright and dark
        // labels without hard-coding a brand or background color.
        var enhancedCanvas = document.createElement('canvas');
        enhancedCanvas.width = sourceCanvas.width;
        enhancedCanvas.height = sourceCanvas.height;
        var enhancedContext = enhancedCanvas.getContext('2d');
        var sourceContext = sourceCanvas.getContext('2d');
        var imageData = sourceContext
          ? sourceContext.getImageData(
              0,
              0,
              sourceCanvas.width,
              sourceCanvas.height
            )
          : null;
        if (!enhancedContext || !sourceContext || !imageData) {
          await window.MediaryOcr._worker.setParameters({
            tessedit_pageseg_mode: '11',
            preserve_interword_spaces: '1'
          });
          var contextFallback = await window.MediaryOcr._worker.recognize(
            sourceCanvas.toDataURL('image/png')
          );
          return contextFallback && contextFallback.data
            ? (contextFallback.data.text || '')
            : '';
        }

        var histogram = new Uint32Array(256);
        for (var pixel = 0; pixel < imageData.data.length; pixel += 4) {
          var luminance = Math.round(
            imageData.data[pixel] * 0.299 +
            imageData.data[pixel + 1] * 0.587 +
            imageData.data[pixel + 2] * 0.114
          );
          histogram[luminance]++;
        }
        var pixelCount = sourceCanvas.width * sourceCanvas.height;
        var lowTarget = pixelCount * 0.02;
        var highTarget = pixelCount * 0.98;
        var low = 0;
        var high = 255;
        var running = 0;
        for (var lowIndex = 0; lowIndex < 256; lowIndex++) {
          running += histogram[lowIndex];
          if (running >= lowTarget) {
            low = lowIndex;
            break;
          }
        }
        running = 0;
        for (var highIndex = 0; highIndex < 256; highIndex++) {
          running += histogram[highIndex];
          if (running >= highTarget) {
            high = highIndex;
            break;
          }
        }
        if (high - low < 32) {
          low = 0;
          high = 255;
        }

        var binaryCanvas = document.createElement('canvas');
        binaryCanvas.width = sourceCanvas.width;
        binaryCanvas.height = sourceCanvas.height;
        var binaryContext = binaryCanvas.getContext('2d');
        var enhancedPixels = enhancedContext.createImageData(
          sourceCanvas.width,
          sourceCanvas.height
        );
        var binaryPixels = binaryContext
          ? binaryContext.createImageData(sourceCanvas.width, sourceCanvas.height)
          : null;
        for (var index = 0; index < imageData.data.length; index += 4) {
          var gray = Math.round(
            imageData.data[index] * 0.299 +
            imageData.data[index + 1] * 0.587 +
            imageData.data[index + 2] * 0.114
          );
          var leveled = Math.max(
            0,
            Math.min(255, ((gray - low) * 255) / Math.max(1, high - low))
          );
          var contrast = Math.max(
            0,
            Math.min(255, (leveled - 128) * 1.35 + 128)
          );
          enhancedPixels.data[index] = contrast;
          enhancedPixels.data[index + 1] = contrast;
          enhancedPixels.data[index + 2] = contrast;
          enhancedPixels.data[index + 3] = imageData.data[index + 3];
          if (binaryPixels) {
            var threshold = contrast > 175 ? 255 : 0;
            binaryPixels.data[index] = threshold;
            binaryPixels.data[index + 1] = threshold;
            binaryPixels.data[index + 2] = threshold;
            binaryPixels.data[index + 3] = imageData.data[index + 3];
          }
        }
        enhancedContext.putImageData(enhancedPixels, 0, 0);
        if (binaryContext && binaryPixels) {
          binaryContext.putImageData(binaryPixels, 0, 0);
        }

        // A luminance conversion can erase yellow lettering on blue packages.
        // The green channel separates those colors while retaining white text;
        // keep it as an additional pass, never as a replacement for full color.
        var channelCanvas = document.createElement('canvas');
        channelCanvas.width = sourceCanvas.width;
        channelCanvas.height = sourceCanvas.height;
        var channelContext = channelCanvas.getContext('2d');
        if (channelContext) {
          var channelPixels = channelContext.createImageData(sourceCanvas.width, sourceCanvas.height);
          for (var channelIndex = 0; channelIndex < imageData.data.length; channelIndex += 4) {
            var channelGray = imageData.data[channelIndex + 1];
            channelPixels.data[channelIndex] = channelGray;
            channelPixels.data[channelIndex + 1] = channelGray;
            channelPixels.data[channelIndex + 2] = channelGray;
            channelPixels.data[channelIndex + 3] = 255;
          }
          channelContext.putImageData(channelPixels, 0, 0);
        }

        var variants = [
          { canvas: enhancedCanvas, pageSegMode: '6' },
          { canvas: enhancedCanvas, pageSegMode: '11' },
          { canvas: binaryCanvas, pageSegMode: '11' },
          { canvas: sourceCanvas, pageSegMode: '11' }
        ];
        if (channelContext) variants.push({ canvas: channelCanvas, pageSegMode: '11' });
        // Packaging in a photo is rarely a perfectly upright document. Keep
        // full-image passes above, then focus on the central label and retry
        // modest skew in both directions. This reduces background interference
        // without making a central crop the only way to recognize a label.
        for (var angle of [0, -8, 8]) {
          var focusedCanvas = document.createElement('canvas');
          focusedCanvas.width = Math.round(sourceCanvas.width * 0.84);
          focusedCanvas.height = Math.round(sourceCanvas.height * 0.75);
          var focusedContext = focusedCanvas.getContext('2d');
          if (!focusedContext) continue;
          focusedContext.fillStyle = '#ffffff';
          focusedContext.fillRect(0, 0, focusedCanvas.width, focusedCanvas.height);
          focusedContext.translate(focusedCanvas.width / 2, focusedCanvas.height / 2);
          focusedContext.rotate(angle * Math.PI / 180);
          focusedContext.drawImage(
            channelContext ? channelCanvas : enhancedCanvas,
            sourceCanvas.width * 0.08,
            sourceCanvas.height * 0.15,
            focusedCanvas.width,
            focusedCanvas.height,
            -focusedCanvas.width / 2,
            -focusedCanvas.height / 2,
            focusedCanvas.width,
            focusedCanvas.height
          );
          variants.push({ canvas: focusedCanvas, pageSegMode: '11' });
        }
        // Preserve useful lines from every pass. Picking only the longest
        // output can discard the readable brand in favor of background text.
        var recognizedLines = new Map();
        for (var variant of variants) {
          await window.MediaryOcr._worker.setParameters({
            tessedit_pageseg_mode: variant.pageSegMode,
            preserve_interword_spaces: '1'
          });
          var attempt = await window.MediaryOcr._worker.recognize(
            variant.canvas.toDataURL('image/png')
          );
          var text = attempt && attempt.data ? (attempt.data.text || '') : '';
          for (var line of text.split(/[\r\n]+/)) {
            var trimmed = line.trim();
            if (trimmed && !recognizedLines.has(trimmed.toLowerCase())) {
              recognizedLines.set(trimmed.toLowerCase(), trimmed);
            }
          }
        }
        return Array.from(recognizedLines.values()).join('\n');
      } catch (error) {
        if (window.MediaryOcr._worker) {
          try { await window.MediaryOcr._worker.terminate(); } catch (_) {}
          window.MediaryOcr._worker = null;
        }
        console.warn('Mediary browser OCR failed', error);
        return '';
      }
    };
    // A single worker cannot safely process overlapping parameter/recognition
    // jobs. Queue scans and recover after failures without poisoning retries.
    window.MediaryOcr._recognizeImage = window.MediaryOcr.recognize;
    window.MediaryOcr._queue = Promise.resolve();
    window.MediaryOcr.recognize = function (imageDataUrl) {
      var scan = window.MediaryOcr._queue.then(function () {
        return window.MediaryOcr._recognizeImage(imageDataUrl);
      });
      window.MediaryOcr._queue = scan.catch(function () {});
      return scan;
    };
  </script>
