name: mediary
description: "Mediary helps people identify, organize, and track medications."
# this application is not published as a dart package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # keep flutterfire releases on one compatible apple sdk version.
  firebase_core: 4.13.0
  firebase_auth: 6.5.7
  cloud_firestore: 6.8.0
  google_sign_in: ^7.2.0
  http: ^1.3.0
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  pasteboard: ^0.5.0
  web: ^1.1.1
  permission_handler: ^12.0.3
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/Mediary App.png
    - assets/icon/Mediary App Dark.png

flutter_launcher_icons:
  ios: true
  image_path: "assets/icon/Mediary App.png"
  remove_alpha_ios: true
