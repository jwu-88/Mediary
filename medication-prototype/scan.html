<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Scan Medication — Flutter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/styles.css" rel="stylesheet">
</head>
<body>
  <main class="app-screen camera-screen" aria-label="Medication camera scanner">
    <div class="camera-view">
      <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=900&q=90" alt="Medication packaging positioned for scanning">
      <div class="camera-gradient"></div>
    </div>
    <div class="status-bar light">
      <span>9:41</span>
      <span class="status-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
    </div>
    <header class="scan-top">
      <button class="icon-button" type="button" aria-label="Close scanner"><i class="fa-solid fa-xmark"></i></button>
      <div class="scan-title"><strong>Scan medication</strong><span>Front label</span></div>
      <button class="icon-button" type="button" aria-label="Toggle flashlight"><i class="fa-solid fa-bolt"></i></button>
    </header>

    <div class="scan-frame" aria-hidden="true">
      <span class="scan-corner tl"></span><span class="scan-corner tr"></span>
      <span class="scan-corner bl"></span><span class="scan-corner br"></span>
      <span class="scan-line"></span>
    </div>
    <p class="scan-tip" id="scan-tip" aria-live="polite"><i class="fa-solid fa-wand-magic-sparkles"></i> Hold steady and keep the label inside the frame</p>

    <div class="capture-row">
      <div class="capture-side"><button type="button" aria-label="Choose image from photos"><i class="fa-regular fa-image"></i></button><span>Photos</span></div>
      <button class="shutter" type="button" data-action="capture" aria-label="Capture medication"></button>
      <div class="capture-side"><button type="button" aria-label="Scan barcode"><i class="fa-solid fa-barcode"></i></button><span>Barcode</span></div>
    </div>
    <div class="camera-tabs" aria-label="Scan mode"><span class="active">LABEL</span><span>PILL</span><span>BARCODE</span></div>
    <div class="home-indicator" style="background:#fff" aria-hidden="true"></div>
  </main>
  <script src="assets/prototype.js"></script>
</body>
</html>
