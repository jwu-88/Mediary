<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Settings — Flutter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/styles.css" rel="stylesheet">
</head>
<body>
  <main class="app-screen" aria-label="Application settings">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
    </div>
    <header class="screen-header">
      <button class="icon-button" type="button" aria-label="Back to profile"><i class="fa-solid fa-chevron-left"></i></button>
      <h2>Settings</h2>
      <span style="width:42px"></span>
    </header>

    <div class="screen-content" style="padding-bottom:32px">
      <div class="section-heading" style="margin-top:4px"><h2>Reminders</h2></div>
      <section class="card settings-list">
        <div class="settings-row"><span class="settings-icon"><i class="fa-solid fa-bell"></i></span><span class="settings-copy"><strong>Dose notifications</strong><span>Notify at scheduled times</span></span><label class="toggle" aria-label="Dose notifications"><input type="checkbox" checked><span class="toggle-track"></span></label></div>
        <div class="settings-row"><span class="settings-icon orange"><i class="fa-solid fa-clock-rotate-left"></i></span><span class="settings-copy"><strong>Follow-up alert</strong><span>Remind me after 15 minutes</span></span><label class="toggle" aria-label="Follow-up alerts"><input type="checkbox" checked><span class="toggle-track"></span></label></div>
        <button class="settings-row" type="button" style="width:100%;border:0;background:transparent;text-align:left"><span class="settings-icon mint"><i class="fa-solid fa-volume-high"></i></span><span class="settings-copy"><strong>Reminder sound</strong><span>Gentle chime</span></span><i class="fa-solid fa-chevron-right settings-value"></i></button>
      </section>

      <div class="section-heading"><h2>App preferences</h2></div>
      <section class="card settings-list">
        <button class="settings-row" type="button" style="width:100%;border-top:0;border-left:0;border-right:0;background:transparent;text-align:left"><span class="settings-icon"><i class="fa-solid fa-globe"></i></span><span class="settings-copy"><strong>Language</strong><span>App display language</span></span><span class="settings-value">English <i class="fa-solid fa-chevron-right"></i></span></button>
        <button class="settings-row" type="button" style="width:100%;border-top:0;border-left:0;border-right:0;background:transparent;text-align:left"><span class="settings-icon mint"><i class="fa-solid fa-ruler"></i></span><span class="settings-copy"><strong>Units</strong><span>Medication measurements</span></span><span class="settings-value">Metric <i class="fa-solid fa-chevron-right"></i></span></button>
        <div class="settings-row"><span class="settings-icon orange"><i class="fa-solid fa-moon"></i></span><span class="settings-copy"><strong>Dark appearance</strong><span>Follow system settings</span></span><label class="toggle" aria-label="Dark appearance"><input type="checkbox"><span class="toggle-track"></span></label></div>
      </section>

      <div class="section-heading"><h2>Privacy & integrations</h2></div>
      <section class="card settings-list">
        <button class="settings-row" type="button" style="width:100%;border-top:0;border-left:0;border-right:0;background:transparent;text-align:left"><span class="settings-icon mint"><i class="fa-brands fa-apple"></i></span><span class="settings-copy"><strong>Apple Health</strong><span>Connected</span></span><span class="settings-value" style="color:var(--mint)">On</span></button>
        <button class="settings-row" type="button" style="width:100%;border-top:0;border-left:0;border-right:0;background:transparent;text-align:left"><span class="settings-icon"><i class="fa-solid fa-lock"></i></span><span class="settings-copy"><strong>Privacy controls</strong><span>Camera, health data, analytics</span></span><i class="fa-solid fa-chevron-right settings-value"></i></button>
        <button class="settings-row" type="button" style="width:100%;border:0;background:transparent;text-align:left"><span class="settings-icon orange"><i class="fa-solid fa-file-export"></i></span><span class="settings-copy"><strong>Export my data</strong><span>Download a secure copy</span></span><i class="fa-solid fa-chevron-right settings-value"></i></button>
      </section>

      <button class="danger-button" type="button"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sign out</button>
      <p style="margin:13px 0 0;text-align:center;color:var(--muted);font-size:10px">Flutter 1.0.0 · Medical information is for reference only</p>
    </div>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
</body>
</html>
