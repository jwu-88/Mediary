<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Medication Library — Flutter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/styles.css" rel="stylesheet">
</head>
<body>
  <main class="app-screen" aria-label="Medication reference library">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
    </div>
    <header class="screen-header">
      <div class="header-copy"><p class="eyebrow">Explore safely</p><h1>Medication library</h1></div>
      <button class="icon-button" type="button" aria-label="Saved medications"><i class="fa-regular fa-bookmark"></i></button>
    </header>

    <div class="screen-content">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input class="search-input" type="search" placeholder="Search medication or condition" aria-label="Search medications">
        <button class="search-filter" type="button" aria-label="Filter medications"><i class="fa-solid fa-sliders"></i></button>
      </div>
      <div class="chip-row" aria-label="Medication categories">
        <button class="chip active" type="button">Popular</button><button class="chip" type="button">Allergy</button><button class="chip" type="button">Pain</button><button class="chip" type="button">Heart</button><button class="chip" type="button">Vitamins</button>
      </div>

      <div class="section-heading"><h2>Learn today</h2><button type="button">See all</button></div>
      <article class="card featured-card">
        <h2>Antibiotics 101</h2>
        <p>Why completing your full course matters.</p>
        <button class="text-link" type="button">Read 3 min <i class="fa-solid fa-arrow-right"></i></button>
        <img src="https://images.unsplash.com/photo-1587854692152-cbe660dbde88?auto=format&fit=crop&w=500&q=88" alt="Medication capsules and bottle">
      </article>

      <div class="section-heading"><h2>Popular medications</h2><button type="button">A–Z</button></div>
      <section class="med-list" aria-label="Popular medications">
        <article class="card med-row">
          <img src="https://images.unsplash.com/photo-1471864190281-a93a3070b6de?auto=format&fit=crop&w=180&q=85" alt="Capsules">
          <div><h3>Amoxicillin</h3><p>Antibiotic · Capsule</p></div>
          <button class="chevron" type="button" aria-label="Open Amoxicillin details"><i class="fa-solid fa-chevron-right"></i></button>
        </article>
        <article class="card med-row">
          <img src="https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=180&q=85" alt="Tablet blister pack">
          <div><h3>Ibuprofen</h3><p>Pain relief · Tablet</p></div>
          <button class="chevron" type="button" aria-label="Open Ibuprofen details"><i class="fa-solid fa-chevron-right"></i></button>
        </article>
        <article class="card med-row">
          <img src="https://images.unsplash.com/photo-1550572017-edd951b55104?auto=format&fit=crop&w=180&q=85" alt="Medication bottle">
          <div><h3>Cetirizine</h3><p>Allergy relief · Tablet</p></div>
          <button class="chevron" type="button" aria-label="Open Cetirizine details"><i class="fa-solid fa-chevron-right"></i></button>
        </article>
      </section>
    </div>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab-item" type="button"><i class="fa-solid fa-house"></i><span>Today</span></button>
      <button class="tab-item" type="button"><i class="fa-regular fa-calendar"></i><span>Calendar</span></button>
      <button class="tab-item" type="button"><i class="fa-solid fa-camera"></i><span>Scan</span></button>
      <button class="tab-item active" type="button"><i class="fa-solid fa-book-medical"></i><span>Library</span></button>
      <button class="tab-item" type="button"><i class="fa-regular fa-user"></i><span>Profile</span></button>
    </nav>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
  <script src="assets/prototype.js"></script>
</body>
</html>
