<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Today — Mediary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/styles.css" rel="stylesheet">
</head>
<body>
  <main class="app-screen" aria-label="Today medication dashboard">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
    </div>

    <header class="screen-header">
      <div class="header-copy">
        <p class="eyebrow">Sunday, August 30</p>
        <h1>Good morning, Jayden</h1>
      </div>
      <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=160&q=85" alt="Jayden's profile">
    </header>

    <div class="screen-content">
      <div class="section-heading first-section"><h2>Weekly progress</h2><button type="button">View report</button></div>
      <section class="card progress-card" aria-label="Weekly adherence 92 percent">
        <div class="progress-ring" aria-hidden="true"></div>
        <div class="progress-copy">
          <h3>You’re right on track</h3>
          <p>11 of 12 doses taken this week</p>
        </div>
      </section>

      <div class="section-heading"><h2>Today’s schedule</h2><button type="button"><i class="fa-solid fa-plus"></i> Add</button></div>
      <section class="timeline" aria-label="Today's scheduled medication doses">
        <article class="card timeline-item">
          <div class="medicine-icon mint"><i class="fa-solid fa-capsules"></i></div>
          <div class="timeline-copy"><strong>Vitamin D3</strong><span>1000 IU · 8:00 AM</span></div>
          <span class="status-check"><i class="fa-solid fa-circle-check"></i> Taken</span>
        </article>
        <article class="card timeline-item">
          <div class="medicine-icon"><i class="fa-solid fa-capsules"></i></div>
          <div class="timeline-copy"><strong>Amoxicillin</strong><span>500 mg · 10:30 AM</span></div>
          <span class="status-time">Up next</span>
        </article>
        <article class="card timeline-item">
          <div class="medicine-icon orange"><i class="fa-solid fa-tablets"></i></div>
          <div class="timeline-copy"><strong>Cetirizine</strong><span>10 mg · 8:00 PM</span></div>
          <span class="status-time">Tonight</span>
        </article>
      </section>
    </div>

    <nav class="tab-bar" aria-label="Primary navigation">
      <button class="tab-item active" type="button"><i class="fa-solid fa-house"></i><span>Today</span></button>
      <button class="tab-item" type="button"><i class="fa-regular fa-calendar"></i><span>Calendar</span></button>
      <button class="tab-item" type="button"><i class="fa-solid fa-camera"></i><span>Scan</span></button>
      <button class="tab-item" type="button"><i class="fa-solid fa-book-medical"></i><span>Library</span></button>
      <button class="tab-item" type="button"><i class="fa-solid fa-gear"></i><span>Settings</span></button>
    </nav>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
  <script src="assets/prototype.js"></script>
</body>
</html>
