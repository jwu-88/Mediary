<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>AI Scan Result — Flutter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="assets/styles.css" rel="stylesheet">
</head>
<body>
  <main class="app-screen" aria-label="Review scanned medication">
    <div class="status-bar">
      <span>9:41</span>
      <span class="status-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span>
    </div>
    <header class="screen-header">
      <button class="icon-button" type="button" aria-label="Return to scanner"><i class="fa-solid fa-chevron-left"></i></button>
      <h2>Review medication</h2>
      <button class="icon-button" type="button" aria-label="Scan again"><i class="fa-solid fa-rotate"></i></button>
    </header>

    <div class="screen-content" style="padding-bottom:100px">
      <section class="card result-hero">
        <img class="result-image" src="https://images.unsplash.com/photo-1471864190281-a93a3070b6de?auto=format&fit=crop&w=300&q=90" alt="Identified capsule medication">
        <div class="result-copy">
          <span class="confidence"><i class="fa-solid fa-circle-check"></i> 98% match</span>
          <h2>Amoxicillin</h2>
          <p>500 mg capsule · Prescription</p>
        </div>
      </section>

      <div class="info-grid">
        <article class="card info-tile"><span>Imprint</span><strong>AMOX 500</strong></article>
        <article class="card info-tile"><span>Manufacturer</span><strong>Sandoz Inc.</strong></article>
        <article class="card info-tile"><span>Form</span><strong>Capsule</strong></article>
        <article class="card info-tile"><span>Color</span><strong>Blue / pink</strong></article>
      </div>

      <aside class="notice" aria-label="Safety notice">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>Confirm the package and prescription label before adding. AI identification does not replace advice from your pharmacist.</span>
      </aside>

      <section class="card schedule-card" aria-labelledby="schedule-title">
        <h2 id="schedule-title">Set your schedule</h2>
        <div class="form-row">
          <div class="field"><label for="dose">Dose</label><select id="dose" class="field-control"><option>1 capsule</option></select></div>
          <div class="field"><label for="frequency">Frequency</label><select id="frequency" class="field-control"><option>Every 8 hours</option></select></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="start">Start date</label><input id="start" class="field-control" type="text" value="Aug 30, 2026"></div>
          <div class="field"><label for="duration">Duration</label><select id="duration" class="field-control"><option>7 days</option></select></div>
        </div>
      </section>
    </div>
    <div class="sticky-action"><button class="primary-button full-width" type="button" data-action="add-calendar"><i class="fa-regular fa-calendar-plus"></i> Add to calendar</button></div>
    <div class="home-indicator" aria-hidden="true"></div>
  </main>
  <script src="assets/prototype.js"></script>
</body>
</html>
